<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#062E20" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" />
  
  <!-- Central Glass Circle -->
  <circle cx="256" cy="236" r="130" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="6" filter="url(#shadow)" />
  <circle cx="256" cy="236" r="118" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  <text x="256" y="278" font-family="Apple Color Emoji, sans-serif" font-size="120" text-anchor="middle">♻️</text>

  <!-- Title Bottom -->
  <text x="256" y="420" font-family="-apple-system, SF Pro Display, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CORATO</text>
  <text x="256" y="452" font-family="-apple-system, SF Pro Text, sans-serif" font-size="20" font-weight="600" fill="#34D399" text-anchor="middle">DIFFERENZIATA</text>
</svg>
